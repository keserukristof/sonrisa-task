<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/headsup/tokens.css">
<link rel="stylesheet" href="ds/headsup/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="hu" style="min-height: 640px">
<header class="hu-header">
<a class="hu-brand" href="Landing.dc.html"><svg viewBox="0 0 26 16" aria-hidden="true"><polyline points="1,9 6,9 9,2 13,14 16,6 18,9 25,9"></polyline></svg>Heads-up</a>
<div class="hu-header__end"><a class="hu-btn hu-btn--ghost hu-btn--sm" href="SignIn.dc.html">Sign in</a></div>
</header>
<main class="hu-page hu-page--narrow" style="padding-top: 48px">
<h1 class="hu-title" style="margin-bottom: 24px">Create your account</h1>
<form class="hu-card hu-card--pad hu-stack" style="gap: 20px">
<div class="hu-field">
<label class="hu-label" for="email">Email</label>
<input class="hu-input" id="email" type="email" value="you@example.com" autocomplete="email">
</div>
<div class="hu-field">
<label class="hu-label" for="password">Password</label>
<input class="hu-input" id="password" type="password" value="12345" aria-invalid="true" aria-describedby="password-error" autocomplete="new-password">
<p class="hu-error" id="password-error"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>Use at least 8 characters.</p>
</div>
<a class="hu-btn hu-btn--primary" href="SignUpConfirm.dc.html">Create account</a>
<p class="hu-muted">We email you a link to confirm this address before you can sign in.</p>
</form>
<p style="margin-top: 16px">Already have an account? <a href="SignIn.dc.html">Sign in</a></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":640}}'>

return {};
}
}
</script>
</body>
</html>
